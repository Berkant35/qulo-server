name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      # Railway nixpacks'te devDependencies atlanabiliyor; CI'da açıkça istiyoruz.
      - name: Install
        run: npm ci --include=dev

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test
        run: npx vitest run

      # Deploy'un derleme adımının kırılmadığını da doğrula (locale/template kopyaları dahil).
      - name: Build
        run: npm run build
